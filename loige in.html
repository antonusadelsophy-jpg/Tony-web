<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل دخول | TONY WEB</title>

  <!-- SEO -->

  <meta name="description" content="احصل على موقع احترافي لعرض أعمالك وزيادة مبيعاتك">

  <meta name="keywords" content="تصميم مواقع, برمجة مواقع, مواقع احترافية">

  <!-- FONT -->

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- EMAILJS -->

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Cairo',sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      overflow-x:hidden;
    }

    /* NAVBAR */

    nav{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 40px;
      background:#111827;
      position:sticky;
      top:0;
      z-index:1000;
      box-shadow:0 0 15px rgba(0,0,0,.4);
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#38bdf8;
      letter-spacing:2px;
    }

    .img{
      width:80px;
      height:80px;
      border-radius:50%;
      object-fit:cover;
      border:3px solid #38bdf8;
    }

    /* MENU BUTTON */

    .menu-btn{
      background:#020617;
      color:white;
      border:none;
      padding:10px 18px;
      border-radius:10px;
      font-size:24px;
      cursor:pointer;
      transition:0.3s;
    }

    .menu-btn:hover{
      background:#38bdf8;
      transform:scale(1.05);
    }

    /* SIDEBAR */

    .sidebar{
      position:fixed;
      top:0;
      right:-250px;
      width:250px;
      height:100%;
      background:#020617;
      padding:80px 20px;
      display:flex;
      flex-direction:column;
      gap:20px;
      transition:0.4s;
      z-index:999;
      box-shadow:0 0 20px rgba(0,0,0,.5);
    }

    .sidebar.show{
      right:0;
    }

    .sidebar a{
      text-decoration:none;
      color:white;
      background:#111827;
      padding:15px;
      border-radius:12px;
      transition:0.3s;
      text-align:center;
      font-size:18px;
    }

    .sidebar a:hover{
      background:#38bdf8;
      transform:translateX(-5px);
    }

    /* HERO */

    .hero{
      text-align:center;
      padding:60px 20px 30px;
    }

    .hero h1{
      font-size:42px;
      margin-bottom:20px;
      background:linear-gradient(to right,#38bdf8,#06b6d4);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .hero p{
      color:#cbd5e1;
      font-size:18px;
    }

    /* FORM */

    .container{
      width:90%;
      max-width:600px;
      margin:40px auto;
    }

    #contact-form{
      background:#111827;
      padding:30px;
      border-radius:20px;
      transition:0.4s;
      border:2px solid transparent;
      box-shadow:0 0 25px rgba(0,0,0,.3);
    }

    #contact-form:hover{
      transform:translateY(-10px);
      border-color:#38bdf8;
      box-shadow:0 0 30px rgba(56,189,248,.4);
    }

    input,
    textarea{
      width:100%;
      padding:15px;
      margin-bottom:18px;
      border:none;
      border-radius:12px;
      background:#1e293b;
      color:white;
      outline:none;
      transition:0.3s;
      font-size:16px;
    }

    input:focus,
    textarea:focus{
      border:2px solid #38bdf8;
      box-shadow:0 0 15px rgba(56,189,248,.4);
    }

    textarea{
      resize:none;
      height:140px;
    }

    /* BUTTON */

    .bot{
      width:100%;
      padding:15px;
      border:none;
      border-radius:50px;
      background:#38bdf8;
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
      font-weight:bold;
    }

    .bot:hover{
      background:#0ea5e9;
      transform:scale(1.03);
      letter-spacing:2px;
      box-shadow:0 0 20px rgba(56,189,248,.6);
    }

    /* FOOTER */

    footer{
      text-align:center;
      padding:20px;
      margin-top:50px;
      color:#94a3b8;
      font-size:15px;
    }

    /* MOBILE */

    @media(max-width:768px){

      nav{
        padding:15px 20px;
      }

      .hero h1{
        font-size:30px;
      }

      .img{
        width:60px;
        height:60px;
      }

    }

  </style>

</head>

<body>

  <!-- NAVBAR -->

  <nav>

    <img src="log.jpg" alt="Logo" class="img">

    <div class="logo">TONY WEB</div>

    <button onclick="toggleSidebar()" class="menu-btn">
      ☰
    </button>

  </nav>

  <!-- SIDEBAR -->

  <div class="sidebar" id="sidebar">

    <a href="index.html">الرئيسية</a>

    <a href="services.html">الخدمات</a>

    <a href="contact1.html">تواصل معنا</a>

    <a href="offers.html">العروض</a>
    <div class="glow"></div>

<div class="card">

    <h2>قيم خدمتنا</h2>

    <div class="stars">
        <span class="star">★</span>
        <span class="star">★</span>
        <span class="star">★</span>
        <span class="star">★</span>
        <span class="star">★</span>
    </div>

    <div class="rating-text">Amazing?</div>

    <div class="desc">
        اضغط علي النجوم لتقييم الخدمة بشكل احترافي ✨
    </div>

</div>

<script>

const stars = document.querySelectorAll('.star');
const text = document.querySelector('.rating-text');

const messages = [
    "حزين 😢",
    "سيئ 😕",
    "جيد 🙂",
    "جيد جداً 😍",
    "ممتاز 🔥"
];

stars.forEach((star,index)=>{

    star.addEventListener('click',()=>{

        stars.forEach((s,i)=>{

            if(i <= index){
                s.classList.add('active');
            }else{
                s.classList.remove('active');
            }

        });

        text.innerHTML = messages[index];

    });

});

</script>

  </div>
  <style>
  .card{
    width:100%;
    padding:1px 20px;
    border-radius:28px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    text-align:center;
    position:relative;
    overflow:hidden;
    box-shadow:
    0 0 30px rgba(255,255,255,0.05),
    inset 0 0 20px rgba(255,255,255,0.03);
}

.card::before{
    content:'';
    position:absolute;
    width:180px;
    height:180px;
    background:#f59e0b;
    filter:blur(100px);
    opacity:.25;
    top:-60px;
    right:-40px;
}

h2{
    color:white;
    font-size:20px;
    margin-bottom:35px;
    letter-spacing:1px;
}

.stars{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:25px;
}

.star{
    font-size:25px;
    cursor:pointer;
    color:#334155;
    transition:.3s ease;
    position:relative;
}

.star.active{
    color:#fbbf24;
    transform:scale(1.15);
    text-shadow:
    0 0 10px #fbbf24,
    0 0 20px #f59e0b,
    0 0 35px #f59e0b;
    animation:pulse .5s ease;
}

.star:hover{
    transform:translateY(-5px) scale(1.12);
}

@keyframes pulse{
    0%{
        transform:scale(.5) rotate(-20deg);
        opacity:0;
    }
    100%{
        transform:scale(1.15);
        opacity:1;
    }
}

.rating-text{
    color:white;
    font-size:28px;
    font-weight:bold;
    min-height:45px;
    transition:.3s;
}

.desc{
    color:#94a3b8;
    margin-top:10px;
    font-size:15px;
    line-height:1.7;
}

.glow{
    position:absolute;
    width:300px;
    height:px;
    border-radius:50%;
    background:#f59e0b;
    filter:blur(140px);
    opacity:.08;
    z-index:-1;
    animation:move 6s linear infinite alternate;
}

@keyframes move{
    from{
        transform:translate(-80px,-40px);
    }
    to{
        transform:translate(80px,40px);
    }
}

</style>

  <!-- HERO -->

  <section class="hero">

    <h1>سجل دخول الآن</h1>

    <p>
      ارسل بياناتك وسنتواصل معك في أسرع وقت
    </p>

  </section>

  <!-- FORM -->

  <div class="container">

    <form id="contact-form">

      <input
      type="text"
      name="name"
      placeholder="اسمك"
      required>

      <input
      type="email"
      name="email"
      placeholder="الإيميل"
      required>

      <input
      type="tel"
      name="phone"
      placeholder="رقم الهاتف"
      required>

      <textarea
      name="message"
      placeholder="رسالتك"
      required></textarea>

      <button type="submit" class="bot">
        إرسال
      </button>

    </form>

  </div>

  <!-- FOOTER -->

  <footer>
    © 2026 جميع الحقوق محفوظة لدي TONY WEB
  </footer>

  <!-- JAVASCRIPT -->

  <script>

    // SIDEBAR

    function toggleSidebar(){

      document
      .getElementById("sidebar")
      .classList
      .toggle("show");

    }

    // EMAILJS INIT

    emailjs.init({
      publicKey: "lAqKn3JfNBg2Ho3jF",
    });

    // FORM SUBMIT

    document
    .getElementById("contact-form")

    .addEventListener("submit", function(e){

      e.preventDefault();

      let params = {

        name: this.name.value,

        email: this.email.value,

        phone: this.phone.value,

        message: this.message.value

      };

      // إرسال الرسالة ليك

      emailjs.send(

        "service_dk8phdr",

        "template_9piizbg",

        params

      )

      // الرد التلقائي للعميل

      .then(() => {

        return emailjs.send(

          "service_dk8phdr",

          "template_7k4yrnp",

          params

        );

      })

      .then(() => {

        alert("تم إرسال الرسالة بنجاح ✅");

        document
        .getElementById("contact-form")
        .reset();

      })

      .catch((error) => {

        alert("حدث خطأ أثناء الإرسال ❌");

        console.log(error);

      });

    });

  </script>

</body>
</html>
